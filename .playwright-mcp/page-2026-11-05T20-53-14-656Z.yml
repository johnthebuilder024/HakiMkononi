                    - listitem [ref=e157]: Right to receive all wages earned up to the date of dismissal.
                  - paragraph [ref=e158]: "What went wrong:"
                  - list [ref=e159]:
                    - listitem [ref=e160]: The employer failed to give you the required notice period.
                    - listitem [ref=e161]: The employer failed to pay your final salary and wages for the period worked.
