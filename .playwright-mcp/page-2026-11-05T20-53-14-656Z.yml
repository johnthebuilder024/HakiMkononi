                  - generic [ref=e125]: 📜
                  - generic [ref=e126]: What The Law Says
                - generic [ref=e127]:
                  - paragraph [ref=e128]:
                    - strong [ref=e129]: Employment Act 2007 – Section 38 (Waiver of notice by employer)
                    - text: If an employee gives notice of termination and the employer waives the notice, the employer must pay remuneration equivalent to the notice period not served unless otherwise agreed.
                  - paragraph [ref=e130]:
                    - strong [ref=e131]: Employment Act 2007 – Section 35 (Termination notice)
                    - text: A contract of service may be terminated by either party with notice; the notice period is determined by the contract or the Act. Failure to give notice is a breach.
                  - paragraph [ref=e132]:
                    - strong [ref=e133]: Employment Act 2007 – Section 18 (When wages or salaries due)
                    - text: An employee is entitled to be paid for work performed up to the date of termination, including any unpaid wages for the period worked.
                  - paragraph [ref=e134]:
                    - strong [ref=e135]: Employment Act 2007 – Section 49 (Remedies for wrongful dismissal and unfair termination)
                    - text: If dismissal is unjustified, the labour officer may recommend payment of wages that would have been earned during the notice period and any other compensation.
                  - paragraph [ref=e136]:
                    - strong [ref=e137]: Employment Act 2007 – Section 36 (Payment in lieu of notice)
                    - text: Either party may terminate without notice if the other party pays remuneration equal to what would have been earned during the notice period.
              - generic [ref=e138]:
                - generic [ref=e139]:
                  - generic [ref=e140]: 💬
                  - generic [ref=e141]: Plain Explanation
                - generic [ref=e142]:
                  - paragraph [ref=e143]: You were dismissed without the required notice period and your employer has not paid your final salary. The law says the employer must pay you the wages you would have earned during the notice period and any unpaid salary. You can demand these payments immediately. If the employer does not comply, you can take the matter to the Labour Court.
                  - paragraph [ref=e144]: "Steps to take RIGHT NOW:"
                  - list [ref=e145]:
                    - listitem [ref=e146]: Gather all documents – contract, payslips, any communication about dismissal.
                    - listitem [ref=e147]: Write and send a demand letter to your employer.
                    - listitem [ref=e148]: If no response, file a complaint with the Labour Office or file a claim in the Labour Court.
              - generic [ref=e149]:
