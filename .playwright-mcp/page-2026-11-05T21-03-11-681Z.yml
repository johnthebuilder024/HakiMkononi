          - generic [ref=f2e94]: My landlord locked me out of my house without notice and kept my belongings inside.
          - generic [ref=f2e121]:
            - img "HakiMkononi" [ref=f2e123]
            - generic [ref=f2e124]:
              - text: 🏛️
              - strong [ref=f2e125]: Want to represent yourself in court?
              - text: Turn on "Self-represent in court" below to get a court document, evidence checklist, and step-by-step filing guide.
              - button "✅ Yes, show me" [ref=f2e126] [cursor=pointer]
          - generic [ref=f2e127]:
            - img "HakiMkononi" [ref=f2e129]
            - generic [ref=f2e130]:
              - generic [ref=f2e131]:
                - generic [ref=f2e132]:
                  - generic [ref=f2e133]: 📜
                  - generic [ref=f2e134]: What The Law Says
                - generic [ref=f2e135]:
                  - paragraph [ref=f2e136]:
                    - strong [ref=f2e137]: Distress for Rent Act (Cap 293) – Section 11 (Landlord may break into house to seize goods fraudulently secured)
                    - text: A landlord may break into a locked house during the day to seize goods that have been fraudulently or clandestinely removed by the tenant, if the goods are kept in a locked place to prevent their seizure as distress for arrears of rent.
                  - paragraph [ref=f2e138]:
                    - strong [ref=f2e139]: Distress for Rent Act (Cap 293) – Section 9 (Landlord may distrain and sell goods fraudulently carried off premises)
                    - text: If a tenant removes or allows goods to be removed from the premises, the landlord may distrain and sell those goods to recover arrears of rent.
                  - paragraph [ref=f2e140]:
                    - strong [ref=f2e141]: Distress for Rent Act (Cap 293) – Section 14 (Tenant holding premises after time notified to pay double rent)
                    - text: If a tenant fails to deliver up possession of the premises at the time specified in a notice, the tenant must pay double the rent from that time onward.
                  - paragraph [ref=f2e142]:
                    - strong [ref=f2e143]: Rent Restriction Act (Cap 296) – Section 29 (Penalty for subjecting tenant to annoyance)
                    - text: A landlord who evicts a tenant without tribunal authority or who intentionally annoys a tenant to force them to vacate or pay higher rent is guilty of an offence and may be fined up to six thousand shillings or imprisoned for up to six months.
              - generic [ref=f2e144]:
                - generic [ref=f2e145]:
                  - generic [ref=f2e146]: 💬
                  - generic [ref=f2e147]: Plain Explanation
                - generic [ref=f2e148]:
                  - paragraph [ref=f2e149]: You have the right to live in the property and to keep your belongings. The landlord cannot lock you out without notice or keep your goods inside. The law allows the landlord to seize goods only if they were removed fraudulently, not simply because you were locked out. Because the landlord locked you out without notice, you are entitled to have your belongings returned and to be paid any unpaid rent. The landlord may also face a fine for annoying you.
                  - paragraph [ref=f2e150]: "Steps to take RIGHT NOW:"
                  - list [ref=f2e151]:
                    - listitem [ref=f2e152]: Send a written demand to the landlord asking for immediate return of your belongings and payment of any unpaid rent.
                    - listitem [ref=f2e153]: Keep a copy of the letter and any receipts or evidence of the lock‑out.
                    - listitem [ref=f2e154]: If the landlord does not comply within 14 days, file a complaint with the Labour Court or the Rent Tribunal.
              - generic [ref=f2e155]:
                - generic [ref=f2e156]:
                  - generic [ref=f2e157]: 💪
                  - generic [ref=f2e158]: Your Rights
                - generic [ref=f2e159]:
                  - paragraph [ref=f2e160]: "Your rights:"
                  - list [ref=f2e161]:
                    - listitem [ref=f2e162]: Right to possession of the property.
                    - listitem [ref=f2e163]: Right to have your belongings returned.
                    - listitem [ref=f2e164]: Right to be paid any unpaid salary or rent.
                  - paragraph [ref=f2e165]: "What went wrong:"
                  - list [ref=f2e166]:
                    - listitem [ref=f2e167]: The landlord locked you out without giving notice.
                    - listitem [ref=f2e168]: The landlord kept your belongings inside the property.
                    - listitem [ref=f2e169]: The landlord failed to follow the legal process for eviction or distress.
              - generic [ref=f2e170]:
                - generic [ref=f2e171]:
                  - generic [ref=f2e172]: ✉️
                  - generic [ref=f2e173]: Write This
                  - generic [ref=f2e174]: 9 left to fill
