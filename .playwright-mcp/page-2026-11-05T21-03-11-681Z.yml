                  - button "📋 Copy" [ref=f2e177] [cursor=pointer]
                - generic [ref=f2e178]: "[DATE] [YOUR NAME] [YOUR ADDRESS] To: [Name of Landlord] [Landlord’s Address] Dear Sir/Madam, Subject: Demand for Return of Belongings and Payment of Unpaid Rent I, [YOUR NAME], write to formally demand the immediate return of all my personal belongings that remain inside the premises at [property address] and the payment of any unpaid rent owed to me. I was locked out of the property without notice, which is unlawful under Kenyan law. Under the Distress for Rent Act (Cap 293) – Section 11, a landlord may only seize goods that have been fraudulently removed by the tenant. Under Section 9, the landlord may distrain and sell goods only if they were removed fraudulently. Under Section 14, a tenant who fails to deliver up possession after a notice must pay double rent, not the case here. Under the Rent Restriction Act (Cap 296) – Section 29, a landlord who evicts a tenant without tribunal authority or who intentionally annoys a tenant is guilty of an offence and may be fined. I demand that you return all my belongings and pay any unpaid rent within 14 days of receiving this letter. Failure to comply will compel me to seek legal redress through the Rent Tribunal. Yours faithfully, [YOUR NAME] [PHONE NUMBER]"
