- generic [active] [ref=f3e1]: "{\"status\": \"done\", \"query_id\": 372, \"is_serious\": false, \"self_rep\": false, \"land_subtype\": \"\", \"answer\": {\"sheria_inasema\": \"**Distress for Rent Act (Cap 293) \\u2013 Section 11 (Landlord may break into house to seize goods fraudulently secured)** \\nA landlord may break into a locked house during the day to seize goods that have been fraudulently or clandestinely removed by the tenant, if the goods are kept in a locked place to prevent their seizure as distress for arrears of rent.\\n\\n**Distress for Rent Act (Cap 293) \\u2013 Section 9 (Landlord may distrain and sell goods fraudulently carried off premises)** \\nIf a tenant removes or allows goods to be removed from the premises, the landlord may distrain and sell those goods to recover arrears of rent.\\n\\n**Distress for Rent Act (Cap 293) \\u2013 Section 14 (Tenant holding premises after time notified to pay double rent)** \\nIf a tenant fails to deliver up possession of the premises at the time specified in a notice, the tenant must pay double the rent from that time onward.\\n\\n**Rent Restriction Act (Cap 296) \\u2013 Section 29 (Penalty for subjecting tenant to annoyance)** \\nA landlord who evicts a tenant without tribunal authority or who intentionally annoys a tenant to force them to vacate or pay higher rent is guilty of an offence and may be fined up to six thousand shillings or imprisoned for up to six months.\", \"tafsiri_rahisi\": \"You have the right to live in the property and to keep your belongings. The landlord cannot lock you out without notice or keep your goods inside. The law allows the landlord to seize goods only if they were removed fraudulently, not simply because you were locked out. Because the landlord locked you out without notice, you are entitled to have your belongings returned and to be paid any unpaid rent. The landlord may also face a fine for annoying you.\\n\\nSteps to take RIGHT NOW: \\n1. Send a written demand to the landlord asking for immediate return of your belongings and payment of any unpaid rent. \\n2. Keep a copy of the letter and any receipts or evidence of the lock\\u2011out. \\n3. If the landlord does not comply within 14 days, file a complaint with the Labour Court or the Rent Tribunal.\", \"haki_yako\": \"Your rights: \\n- Right to possession of the property. \\n- Right to have your belongings returned. \\n- Right to be paid any unpaid salary or rent.\\n\\nWhat went wrong: \\n- The landlord locked you out without giving notice. \\n- The landlord kept your belongings inside the property. \\n- The landlord failed to follow the legal process for eviction or distress.\", \"andika_hivi\": \"[DATE] \\n\\n[YOUR NAME] \\n[YOUR ADDRESS] \\n\\nTo: \\n[Name of Landlord] \\n[Landlord\\u2019s Address] \\n\\nDear Sir/Madam,\\n\\nSubject: Demand for Return of Belongings and Payment of Unpaid Rent\\n\\nI, [YOUR NAME], write to formally demand the immediate return of all my personal belongings that remain inside the premises at [property address] and the payment of any unpaid rent owed to me. I was locked out of the property without notice, which is unlawful under Kenyan law.\\n\\nUnder the Distress for Rent Act (Cap 293) \\u2013 Section 11, a landlord may only seize goods that have been fraudulently removed by the tenant. Under Section 9, the landlord may distrain and sell goods only if they were removed fraudulently. Under Section 14, a tenant who fails to deliver up possession after a notice must pay double rent, not the case here. Under the Rent Restriction Act (Cap 296) \\u2013 Section 29, a landlord who evicts a tenant without tribunal authority or who intentionally annoys a tenant is guilty of an offence and may be fined.\\n\\nI demand that you return all my belongings and pay any unpaid rent within 14 days of receiving this letter. Failure to comply will compel me to seek legal redress through the Rent Tribunal.\\n\\nYours faithfully,\\n\\n[YOUR NAME] \\n[PHONE NUMBER]\", \"hati_mahakama\": \"\", \"ushahidi\": \"\", \"ratiba\": \"\"}, \"sources\": [{\"title\": \"Distress for Rent Act (Cap 293)\", \"section\": \"11. Landlord may break into house to seize goods fraudulently secured therein\", \"url\": \"https://new.kenyalaw.org/akn/ke/act/1951/293/eng@2022-12-31\", \"category\": \"landlord_tenant\"}, {\"title\": \"Distress for Rent Act (Cap 293)\", \"section\": \"20. Penalty on superior landlord disregarding lodger\\u2019s declaration\", \"url\": \"https://new.kenyalaw.org/akn/ke/act/1951/293/eng@2022-12-31\", \"category\": \"landlord_tenant\"}, {\"title\": \"Distress for Rent Act (Cap 293)\", \"section\": \"14. Tenant holding premises after time notified to pay double rent\", \"url\": \"https://new.kenyalaw.org/akn/ke/act/1951/293/eng@2022-12-31\", \"category\": \"landlord_tenant\"}, {\"title\": \"Distress for Rent Act (Cap 293)\", \"section\": \"9. Landlord may distrain and sell goods fraudulently carried off premises\", \"url\": \"https://new.kenyalaw.org/akn/ke/act/1951/293/eng@2022-12-31\", \"category\": \"landlord_tenant\"}, {\"title\": \"Rent Restriction Act (Cap 296)\", \"section\": \"29. Penalty for subjecting tenant to annoyance\", \"url\": \"https://new.kenyalaw.org/akn/ke/act/1959/296/eng@2022-12-31\", \"category\": \"landlord_tenant\"}], \"fee_guide\": {\"category\": \"landlord_tenant\", \"range\": \"KES 10,000 \\u2013 80,000\", \"note\": \"Eviction disputes or deposit recovery at the Rent Tribunal or Magistrate Court. Simple cases can be filed yourself (no lawyer needed). Consultation fee: KES 1,500\\u20133,000.\"}, \"elapsed_seconds\": 791, \"assistant_summary\": \"\"}"