- generic [active] [ref=f2e1]: "{\"status\": \"done\", \"query_id\": 373, \"is_serious\": false, \"self_rep\": false, \"land_subtype\": \"\", \"answer\": {\"sheria_inasema\": \"**Distress for Rent Act (Cap 293) \\u2013 Section 11 (Landlord may break into house to seize goods fraudulently secured)** \\nA landlord may break into a locked house during the day to seize goods that have been fraudulently removed and kept locked to prevent seizure.\\n\\n**Distress for Rent Act (Cap 293) \\u2013 Section 9 (Landlord may distrain and sell goods fraudulently carried off premises)** \\nA landlord may distrain and sell goods that have been fraudulently removed from premises to recover rent.\\n\\n**Distress for Rent Act (Cap 293) \\u2013 Section 14 (Tenant holding premises after time notified to pay double rent)** \\nIf a tenant fails to vacate after giving notice, they must pay double rent until they vacate.\\n\\n**Distress for Rent Act (Cap 293) \\u2013 Section 20 (Penalty on superior landlord disregarding lodger\\u2019s declaration)** \\nA superior landlord who, after being served with a declaration, still levies distress on the lodger\\u2019s goods is penalised.\\n\\n**Rent Restriction Act (Cap 296) \\u2013 Section 29 (Penalty for subjecting tenant to annoyance)** \\nA landlord who evicts a tenant without tribunal authority or wilfully annoys a tenant to induce vacate or higher rent is guilty of an offence and liable to a fine or imprisonment.\", \"tafsiri_rahisi\": \"You have the right to live in the property and to keep your belongings. The landlord cannot lock you out without notice or keep your goods inside. The landlord\\u2019s action is unlawful and may expose them to a fine or imprisonment under Section\\u202f29 of the Rent Restriction Act. You should demand that the landlord return your belongings and restore your access immediately. If the landlord does not comply, you can seek a court order and report the offence to the relevant authorities.\\n\\nSteps to take RIGHT NOW: \\n1. Send a written demand to the landlord requesting immediate return of your belongings and restoration of access. \\n2. If no response within 14 days, file a complaint with the local Land Control Board or the police. \\n3. Prepare to file a claim in the Magistrate\\u2019s Court for unlawful eviction and damages.\", \"haki_yako\": \"Your rights: \\n- Right to occupy the premises and keep your personal belongings. \\n- Right to be given proper notice before any eviction or lock\\u2011out.\\n\\nWhat went wrong: \\n- The landlord locked you out without giving notice. \\n- The landlord kept your belongings inside, preventing you from accessing them.\", \"andika_hivi\": \"[DATE] \\n\\n[YOUR NAME] \\n[YOUR ADDRESS] \\n\\nTo: \\n[Name of Landlord] \\n[Landlord\\u2019s Address] \\n\\nDear Sir/Madam,\\n\\nSubject: Demand for Return of Belongings and Restoration of Access\\n\\nI, [YOUR NAME], write to formally demand that you immediately return all my personal belongings that are currently kept in the premises and restore my access to the property. I was locked out of the house without any notice, which is unlawful under Kenyan law.\\n\\nUnder the Rent Restriction Act (Cap 296) \\u2013 Section 29, a landlord who evicts a tenant without tribunal authority or wilfully annoys a tenant to induce vacate or higher rent is guilty of an offence and liable to a fine or imprisonment. Your action of locking me out and withholding my belongings constitutes such an offence.\\n\\nI demand that you return my belongings and restore my access to the premises within 14 days of receiving this letter. Failure to comply will compel me to seek legal redress through the Magistrate\\u2019s Court.\\n\\nYours faithfully,\\n\\n[YOUR NAME] \\n[PHONE NUMBER]\", \"hati_mahakama\": \"\", \"ushahidi\": \"\", \"ratiba\": \"\"}, \"sources\": [{\"title\": \"Distress for Rent Act (Cap 293)\", \"section\": \"11. Landlord may break into house to seize goods fraudulently secured therein\", \"url\": \"https://new.kenyalaw.org/akn/ke/act/1951/293/eng@2022-12-31\", \"category\": \"landlord_tenant\"}, {\"title\": \"Distress for Rent Act (Cap 293)\", \"section\": \"20. Penalty on superior landlord disregarding lodger\\u2019s declaration\", \"url\": \"https://new.kenyalaw.org/akn/ke/act/1951/293/eng@2022-12-31\", \"category\": \"landlord_tenant\"}, {\"title\": \"Distress for Rent Act (Cap 293)\", \"section\": \"14. Tenant holding premises after time notified to pay double rent\", \"url\": \"https://new.kenyalaw.org/akn/ke/act/1951/293/eng@2022-12-31\", \"category\": \"landlord_tenant\"}, {\"title\": \"Distress for Rent Act (Cap 293)\", \"section\": \"9. Landlord may distrain and sell goods fraudulently carried off premises\", \"url\": \"https://new.kenyalaw.org/akn/ke/act/1951/293/eng@2022-12-31\", \"category\": \"landlord_tenant\"}, {\"title\": \"Rent Restriction Act (Cap 296)\", \"section\": \"29. Penalty for subjecting tenant to annoyance\", \"url\": \"https://new.kenyalaw.org/akn/ke/act/1959/296/eng@2022-12-31\", \"category\": \"landlord_tenant\"}], \"fee_guide\": {\"category\": \"landlord_tenant\", \"range\": \"KES 10,000 \\u2013 80,000\", \"note\": \"Eviction disputes or deposit recovery at the Rent Tribunal or Magistrate Court. Simple cases can be filed yourself (no lawyer needed). Consultation fee: KES 1,500\\u20133,000.\"}, \"elapsed_seconds\": 126346, \"assistant_summary\": \"\"}"