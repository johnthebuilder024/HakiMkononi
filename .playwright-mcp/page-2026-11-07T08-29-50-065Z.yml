- generic [active] [ref=f6e1]: "{\"status\": \"done\", \"query_id\": 378, \"is_serious\": false, \"self_rep\": false, \"land_subtype\": \"dispute\", \"answer\": {\"sheria_inasema\": \"[Land Sale Deposit Fraud and Recovery Kenya] \\u2013 Section \\u2014 (What to do when seller takes deposit and disappears) \\nThe sale agreement is a binding contract under the Law of Contract Act (Cap\\u202f23). The seller is in breach of contract. You can sue for specific performance, refund of the deposit plus interest and damages. If the seller acted with intent to defraud, this is a criminal offence under the Penal Code.\\n\\n[Contract Law \\u2013 Deposit Recovery Kenya] \\u2013 Section \\u2014 (Refund of deposit when contract fails or seller breaches) \\nIf the seller fails to deliver what was promised, the sale does not proceed, misrepresents the land, or has no title, you may recover your deposit through rescission, damages, or specific performance.\", \"tafsiri_rahisi\": \"You paid a deposit for land and the seller has disappeared. The contract is binding, so the seller must either complete the sale or return your money. You can sue for the refund of the deposit, interest, and damages. If the seller intended to defraud you, you can also report them to the police. \\n\\nSteps to take RIGHT NOW: \\n1. Send a formal demand letter to the seller demanding the refund of your deposit and delivery of the title deed within 14 days. \\n2. If the seller does not comply, file a civil claim in the appropriate court for rescission of the contract and damages. \\n3. Report the seller to the police for possible fraud under the Penal Code.\", \"haki_yako\": \"Your rights: \\n- Right to a refund of the deposit plus interest and damages. \\n- Right to specific performance (completion of the sale). \\n\\nWhat went wrong: \\n- The seller breached the contract by not delivering the title deed. \\n- The seller failed to return the deposit. \\n- The seller acted with intent to defraud.\", \"andika_hivi\": \"(DEMAND LETTER)\\n\\n[DATE]\\n\\n[YOUR NAME] \\n[YOUR ADDRESS]\\n\\nTo: \\n[Seller's Name] \\n[Seller's Address]\\n\\nDear Sir/Madam,\\n\\nSubject: Demand for Refund of Deposit and Delivery of Title Deed\\n\\nI, [YOUR NAME], write to formally demand compliance with my legal rights. I paid a deposit of [amount] on [date] for the purchase of land at [location]. The seller has disappeared and refuses to provide the title deed or return my deposit.\\n\\nUnder the Land Sale Deposit Fraud and Recovery Kenya, the sale agreement is a binding contract under the Law of Contract Act (Cap\\u202f23). The seller is in breach of contract and may be liable for refund of the deposit plus interest and damages. I demand that you refund my deposit of [amount] and deliver the title deed within 14 days of receiving this letter. Failure to comply will compel me to seek legal redress through the Magistrate Court.\\n\\nYours faithfully,\\n\\n[YOUR NAME] \\n[PHONE NUMBER]\", \"hati_mahakama\": \"\", \"ushahidi\": \"\", \"ratiba\": \"\"}, \"sources\": [{\"title\": \"Land Sale Deposit Fraud and Recovery Kenya\", \"section\": \"What to do when seller takes deposit and disappears\", \"url\": \"https://kenyalaw.org\", \"category\": \"land\"}, {\"title\": \"Distress for Rent Act (Cap 293)\", \"section\": \"9. Landlord may distrain and sell goods fraudulently carried off premises\", \"url\": \"https://new.kenyalaw.org/akn/ke/act/1951/293/eng@2022-12-31\", \"category\": \"landlord_tenant\"}, {\"title\": \"Contract Law \\u2014 Deposit Recovery Kenya\", \"section\": \"Refund of deposit when contract fails or seller breaches\", \"url\": \"https://kenyalaw.org\", \"category\": \"land\"}, {\"title\": \"Distress for Rent Act (Cap 293)\", \"section\": \"10. Penalty for fraud, or assisting therein\", \"url\": \"https://new.kenyalaw.org/akn/ke/act/1951/293/eng@2022-12-31\", \"category\": \"landlord_tenant\"}, {\"title\": \"Distress for Rent Act (Cap 293)\", \"section\": \"5. Rent in arrears may be distrained for after determination of lease\", \"url\": \"https://new.kenyalaw.org/akn/ke/act/1951/293/eng@2022-12-31\", \"category\": \"landlord_tenant\"}], \"fee_guide\": {\"category\": \"landlord_tenant\", \"range\": \"KES 10,000 \\u2013 80,000\", \"note\": \"Eviction disputes or deposit recovery at the Rent Tribunal or Magistrate Court. Simple cases can be filed yourself (no lawyer needed). Consultation fee: KES 1,500\\u20133,000.\"}, \"elapsed_seconds\": 649, \"assistant_summary\": \"\"}"