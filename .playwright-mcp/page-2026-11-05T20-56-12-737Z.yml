- generic [active] [ref=f1e1]: "{\"status\": \"done\", \"query_id\": 371, \"is_serious\": false, \"self_rep\": false, \"land_subtype\": \"\", \"answer\": {\"sheria_inasema\": \"**Employment Act 2007 \\u2013 Section 38 (Waiver of notice by employer)** \\nIf an employee gives notice of termination and the employer waives the notice, the employer must pay remuneration equivalent to the notice period not served unless otherwise agreed.\\n\\n**Employment Act 2007 \\u2013 Section 35 (Termination notice)** \\nA contract of service may be terminated by either party with notice; the notice period is determined by the contract or the Act. Failure to give notice is a breach.\\n\\n**Employment Act 2007 \\u2013 Section 18 (When wages or salaries due)** \\nAn employee is entitled to be paid for work performed up to the date of termination, including any unpaid wages for the period worked.\\n\\n**Employment Act 2007 \\u2013 Section 49 (Remedies for wrongful dismissal and unfair termination)** \\nIf dismissal is unjustified, the labour officer may recommend payment of wages that would have been earned during the notice period and any other compensation.\\n\\n**Employment Act 2007 \\u2013 Section 36 (Payment in lieu of notice)** \\nEither party may terminate without notice if the other party pays remuneration equal to what would have been earned during the notice period.\", \"tafsiri_rahisi\": \"You were dismissed without the required notice period and your employer has not paid your final salary. The law says the employer must pay you the wages you would have earned during the notice period and any unpaid salary. You can demand these payments immediately. If the employer does not comply, you can take the matter to the Labour Court.\\n\\nSteps to take RIGHT NOW: \\n1. Gather all documents \\u2013 contract, payslips, any communication about dismissal. \\n2. Write and send a demand letter to your employer. \\n3. If no response, file a complaint with the Labour Office or file a claim in the Labour Court.\", \"haki_yako\": \"Your rights: \\n- Right to receive notice of termination or payment in lieu of notice. \\n- Right to receive all wages earned up to the date of dismissal.\\n\\nWhat went wrong: \\n- The employer failed to give you the required notice period. \\n- The employer failed to pay your final salary and wages for the period worked.\", \"andika_hivi\": \"(DEMAND LETTER)\\n\\n[DATE]\\n\\n[YOUR NAME] \\n[YOUR ADDRESS] \\n\\nTo: \\n[Name of Employer] \\n[Employer\\u2019s Address] \\n\\nDear Sir/Madam,\\n\\nSubject: Demand for payment of wages and notice compensation\\n\\nI, [YOUR NAME], write to formally demand compliance with my legal rights. I was dismissed from my position on [date of dismissal] without the required notice period and have not received my final salary or wages for the period worked.\\n\\nUnder the Employment Act 2007, Section 38, I am entitled to remuneration equivalent to the notice period not served. Under Section 49, I am also entitled to any wages that would have been earned during that period. I demand that you pay the full amount of my unpaid wages and the notice compensation within 14 days of receiving this letter. Failure to comply will compel me to seek legal redress through the Labour Court.\\n\\nYours faithfully,\\n\\n[YOUR NAME] \\n[PHONE NUMBER]\", \"hati_mahakama\": \"\", \"ushahidi\": \"\", \"ratiba\": \"\"}, \"sources\": [{\"title\": \"Employment Act 2007\", \"section\": \"38. Waiver of notice by employer\", \"url\": \"https://new.kenyalaw.org/akn/ke/act/2007/11/eng@2024-03-22\", \"category\": \"employment\"}, {\"title\": \"Employment Act 2007\", \"section\": \"35. Termination notice\", \"url\": \"https://new.kenyalaw.org/akn/ke/act/2007/11/eng@2024-03-22\", \"category\": \"employment\"}, {\"title\": \"Employment Act 2007\", \"section\": \"18. When wages or salaries due\", \"url\": \"https://new.kenyalaw.org/akn/ke/act/2007/11/eng@2024-03-22\", \"category\": \"employment\"}, {\"title\": \"Employment Act 2007\", \"section\": \"49. Remedies for wrongful dismissal and unfair termination\", \"url\": \"https://new.kenyalaw.org/akn/ke/act/2007/11/eng@2024-03-22\", \"category\": \"employment\"}, {\"title\": \"Employment Act 2007\", \"section\": \"36. Payment in lieu of notice\", \"url\": \"https://new.kenyalaw.org/akn/ke/act/2007/11/eng@2024-03-22\", \"category\": \"employment\"}], \"fee_guide\": {\"category\": \"employment\", \"range\": \"KES 20,000 \\u2013 150,000\", \"note\": \"Unfair dismissal / unpaid wages at Employment & Labour Court. Many advocates take 20\\u201330% of the award (no win, no fee). Consultation fee: KES 2,000\\u20135,000.\"}, \"elapsed_seconds\": 443, \"assistant_summary\": \"\"}"