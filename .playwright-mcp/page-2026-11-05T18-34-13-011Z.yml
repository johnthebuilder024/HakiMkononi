        - generic [ref=f2e84]:
          - generic [ref=f2e85]: I want to buy a plot in Kiambu. The seller showed me a title deed number KIAMBU/001/234. Is this land clean?
          - generic [ref=f2e104]:
            - img "HakiMkononi" [ref=f2e106]
            - generic [ref=f2e107]:
              - text: 🏛️
              - strong [ref=f2e108]: Want to represent yourself in court?
              - text: Turn on "Self-represent in court" below to get a court document, evidence checklist, and step-by-step filing guide.
              - button "✅ Yes, show me" [ref=f2e109] [cursor=pointer]
          - generic [ref=f2e110]:
            - img "HakiMkononi" [ref=f2e112]
            - generic [ref=f2e113]:
              - generic [ref=f2e114]:
                - generic [ref=f2e115]:
                  - generic [ref=f2e116]: 📜
                  - generic [ref=f2e117]: What The Law Says
                - generic [ref=f2e118]:
                  - heading "WHAT TO CHECK" [level=2] [ref=f2e119]
                  - list [ref=f2e120]:
                    - listitem [ref=f2e121]:
                      - strong [ref=f2e122]: Ardhisasa search
                      - text: – confirm the LR number, title status (clean, caution, charge, caveat).
                    - listitem [ref=f2e123]:
                      - strong [ref=f2e124]: LR number verification
                      - text: – ensure the format matches Kiambu’s standard (e.g., KIAMBU/001/234).
                    - listitem [ref=f2e125]:
                      - strong [ref=f2e126]: Land Control Board consent
                      - text: – required for agricultural land; not needed for Nairobi town plots.
                    - listitem [ref=f2e127]:
                      - strong [ref=f2e128]: Advocate check on LSK register
                      - text: – confirm the seller’s lawyer is registered.
                    - listitem [ref=f2e129]:
                      - strong [ref=f2e130]: Rates clearance
                      - text: – verify that all land rates are paid up to date.
                    - listitem [ref=f2e131]:
                      - strong [ref=f2e132]: Survey beacon check
                      - text: – confirm the beacon on the title matches the physical plot.
                  - heading "HOW TO DO IT STEP BY STEP" [level=2] [ref=f2e133]
                  - heading "1. Ardhisasa Search" [level=3] [ref=f2e134]
                  - list [ref=f2e135]:
                    - listitem [ref=f2e136]:
                      - strong [ref=f2e137]: "URL:"
                      - link "https://ardhisasa.go.ke" [ref=f2e138] [cursor=pointer]:
                        - /url: https://ardhisasa.go.ke
                    - listitem [ref=f2e139]:
                      - strong [ref=f2e140]: "Steps:"
                      - list [ref=f2e141]:
                        - listitem [ref=f2e142]: Click “Search Land” → “LR Number Search.”
                        - listitem [ref=f2e143]:
                          - text: "Enter the LR number exactly as shown:"
                          - code [ref=f2e144]: KIAMBU/001/234
                          - text: .
                        - listitem [ref=f2e145]:
                          - text: "Review the result:"
                          - list [ref=f2e146]:
                            - listitem [ref=f2e147]:
                              - strong [ref=f2e148]: Clean
                              - text: – no encumbrances.
                            - listitem [ref=f2e149]:
                              - strong [ref=f2e150]: Caution
                              - text: – a caution notice is registered; you’ll need to investigate the reason.
                            - listitem [ref=f2e151]:
                              - strong [ref=f2e152]: Charge
                              - text: – a charge (mortgage, lease, etc.) is registered; you’ll need to clear it or negotiate.
                            - listitem [ref=f2e153]:
                              - strong [ref=f2e154]: Caveat
                              - text: – a caveat is registered; you’ll need to resolve the dispute before proceeding.
                  - heading "2. LR Number Verification" [level=3] [ref=f2e155]
                  - list [ref=f2e156]:
                    - listitem [ref=f2e157]:
                      - text: Kiambu’s LR numbers typically follow the pattern
                      - code [ref=f2e158]: KIAMBU/XXX/YYY
                      - text: .
                    - listitem [ref=f2e159]: Verify that the first part is “KIAMBU” and that the number of digits matches the county’s format.
                  - heading "3. Land Control Board Consent" [level=3] [ref=f2e160]
                  - list [ref=f2e161]:
                    - listitem [ref=f2e162]:
                      - strong [ref=f2e163]: Agricultural land
                      - text: – always requires a Land Control Board (LCB) consent.
                    - listitem [ref=f2e164]:
                      - strong [ref=f2e165]: Town plots (Nairobi)
                      - text: – no LCB consent needed.
                    - listitem [ref=f2e166]:
                      - strong [ref=f2e167]: "How to check:"
                      - list [ref=f2e168]:
                        - listitem [ref=f2e169]: Visit the LCB office in Kiambu or their website (if available).
                        - listitem [ref=f2e170]: Request the consent status for the LR number.
                        - listitem [ref=f2e171]: If consent is missing, you cannot register the transfer.
                  - heading "4. Advocate Check on LSK Register" [level=3] [ref=f2e172]
                  - list [ref=f2e173]:
                    - listitem [ref=f2e174]:
                      - strong [ref=f2e175]: "URL:"
                      - link "https://new.kenyalaw.org" [ref=f2e176] [cursor=pointer]:
                        - /url: https://new.kenyalaw.org
                    - listitem [ref=f2e177]:
                      - strong [ref=f2e178]: "Steps:"
                      - list [ref=f2e179]:
                        - listitem [ref=f2e180]: Go to “LSK Register.”
                        - listitem [ref=f2e181]: Search the seller’s lawyer’s name.
                        - listitem [ref=f2e182]: Confirm they are listed as a licensed advocate.
                  - heading "5. Rates Clearance" [level=3] [ref=f2e183]
                  - list [ref=f2e184]:
                    - listitem [ref=f2e185]:
                      - strong [ref=f2e186]: "County portal:"
                      - text: Kiambu County’s e‑services portal (e.g.,
                      - link "https://www.kiambu.go.ke" [ref=f2e187] [cursor=pointer]:
                        - /url: https://www.kiambu.go.ke
                      - text: ).
                    - listitem [ref=f2e188]:
                      - strong [ref=f2e189]: "Steps:"
                      - list [ref=f2e190]:
                        - listitem [ref=f2e191]: Log in or register.
                        - listitem [ref=f2e192]: Enter the LR number or plot details.
                        - listitem [ref=f2e193]: Check the rates payment history.
                        - listitem [ref=f2e194]: If unpaid, obtain a clearance certificate from the county.
                  - heading "6. Survey Beacon Check" [level=3] [ref=f2e195]
                  - list [ref=f2e196]:
                    - listitem [ref=f2e197]:
                      - strong [ref=f2e198]: "How to do it:"
                      - list [ref=f2e199]:
                        - listitem [ref=f2e200]: Locate the beacon number on the title deed.
                        - listitem [ref=f2e201]: Visit the plot and verify the beacon’s physical presence and location.
                        - listitem [ref=f2e202]: If the beacon is missing or mismatched, you may need a new survey.
                  - heading "RED FLAGS — STOP AND INVESTIGATE" [level=2] [ref=f2e203]
                  - list [ref=f2e204]:
                    - listitem [ref=f2e205]:
                      - strong [ref=f2e206]: Seller pushes for quick payment
                      - text: before you complete the searches.
                    - listitem [ref=f2e207]:
                      - strong [ref=f2e208]: Title format mismatch
                      - text: – e.g., a green card for a plot that should be a blue title in Kiambu.
                    - listitem [ref=f2e209]:
                      - strong [ref=f2e210]: Missing LCB consent
                      - text: for an agricultural parcel.
                    - listitem [ref=f2e211]:
                      - strong [ref=f2e212]: Advocate not listed
                      - text: on the LSK register.
                    - listitem [ref=f2e213]:
                      - strong [ref=f2e214]: Duplicate claims
                      - text: – two people claiming the same LR number.
                    - listitem [ref=f2e215]:
                      - strong [ref=f2e216]: Caution or charge
                      - text: already registered on Ardhisasa.
                    - listitem [ref=f2e217]:
                      - strong [ref=f2e218]: Rates unpaid
                      - text: or no clearance certificate.
                    - listitem [ref=f2e219]:
                      - strong [ref=f2e220]: Beacon mismatch
                      - text: – the beacon on the deed does not match the physical beacon.
                  - heading "YOUR NEXT STEP RIGHT NOW" [level=2] [ref=f2e221]
                  - paragraph [ref=f2e222]:
                    - strong [ref=f2e223]:
                      - text: Perform the Ardhisasa search for
                      - code [ref=f2e224]: KIAMBU/001/234
                      - text: immediately.
                  - list [ref=f2e225]:
                    - listitem [ref=f2e226]: If the result shows “clean,” proceed to the next checks.
                    - listitem [ref=f2e227]: If it shows any caution, charge, or caveat, halt the transaction and investigate further before moving forward.
