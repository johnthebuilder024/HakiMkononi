- generic [active] [ref=f4e1]: "{\"status\": \"done\", \"query_id\": 368, \"is_serious\": false, \"self_rep\": false, \"land_subtype\": \"dispute\", \"answer\": {\"sheria_inasema\": \"No relevant sections from the provided list apply to a property sale where a seller fails to deliver a title deed after receiving a deposit.\", \"tafsiri_rahisi\": \"You paid a deposit for a property but the seller has not given you the title deed. This is a breach of the contract you signed. You can ask the seller to give you the deed or take legal action. If the seller does not comply, you may need to involve the court or the Registrar of Deeds.\\n\\nSteps to take RIGHT NOW:\\n1. Send a written demand to the seller asking for the title deed within 14 days.\\n2. File a complaint with the Registrar of Deeds to register the sale and request the deed.\\n3. If the seller still refuses, consider filing a civil claim for breach of contract and/or a criminal complaint for fraud.\", \"haki_yako\": \"Your rights:\\n- Right to receive the title deed as agreed in the sale contract.\\n- Right to enforce the contract and seek damages for breach.\\n\\nWhat went wrong:\\n- The seller failed to deliver the title deed after receiving your deposit.\\n- The seller did not comply with the terms of the sale agreement.\", \"andika_hivi\": \"(DEMAND LETTER)\\n\\n[DATE]\\n\\n[YOUR NAME] \\n[YOUR ADDRESS] \\n\\nTo: \\n[Name of Seller] \\n[Seller\\u2019s Address] \\n\\nDear Sir/Madam,\\n\\nSubject: Demand for Delivery of Title Deed\\n\\nI, [YOUR NAME], write to formally demand that you deliver the title deed for the property at [property address] within 14 days of receiving this letter. I paid a deposit of [amount] on [date] and the sale contract was signed on [date]. However, you have not provided the deed and have disappeared from contact.\\n\\nUnder no applicable act, the law requires the seller to deliver the title deed as agreed in the contract. I demand that you provide the deed within 14 days of receiving this letter. Failure to comply will compel me to seek legal redress through the appropriate court.\\n\\nYours faithfully,\\n\\n[YOUR NAME] \\n[PHONE NUMBER]\", \"hati_mahakama\": \"\", \"ushahidi\": \"\", \"ratiba\": \"\"}, \"sources\": [{\"title\": \"Distress for Rent Act (Cap 293)\", \"section\": \"9. Landlord may distrain and sell goods fraudulently carried off premises\", \"url\": \"https://new.kenyalaw.org/akn/ke/act/1951/293/eng@2022-12-31\", \"category\": \"landlord_tenant\"}, {\"title\": \"Distress for Rent Act (Cap 293)\", \"section\": \"10. Penalty for fraud, or assisting therein\", \"url\": \"https://new.kenyalaw.org/akn/ke/act/1951/293/eng@2022-12-31\", \"category\": \"landlord_tenant\"}, {\"title\": \"Distress for Rent Act (Cap 293)\", \"section\": \"5. Rent in arrears may be distrained for after determination of lease\", \"url\": \"https://new.kenyalaw.org/akn/ke/act/1951/293/eng@2022-12-31\", \"category\": \"landlord_tenant\"}, {\"title\": \"Distress for Rent Act (Cap 293)\", \"section\": \"20. Penalty on superior landlord disregarding lodger\\u2019s declaration\", \"url\": \"https://new.kenyalaw.org/akn/ke/act/1951/293/eng@2022-12-31\", \"category\": \"landlord_tenant\"}, {\"title\": \"Landlord and Tenant Act (Cap 301)\", \"section\": \"14. Filing of determination or order in court\", \"url\": \"https://new.kenyalaw.org/akn/ke/act/1965/301/eng@2022-12-31\", \"category\": \"landlord_tenant\"}], \"fee_guide\": {\"category\": \"landlord_tenant\", \"range\": \"KES 10,000 \\u2013 80,000\", \"note\": \"Eviction disputes or deposit recovery at the Rent Tribunal or Magistrate Court. Simple cases can be filed yourself (no lawyer needed). Consultation fee: KES 1,500\\u20133,000.\"}, \"elapsed_seconds\": 5308, \"assistant_summary\": \"\"}"