services:
  # ── Nightly scraper — pulls new Kenya Law judgments, extracts court
  #    interpretations, embeds them so RAG can cite real rulings.
  - type: cron
    name: scrape-kenyalaw
    env: python
    plan: free
    schedule: "0 2 * * *"   # 2am Nairobi time every night (UTC+3, so 23:00 UTC)
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py scrape_kenyalaw"

  # ── Weekly learning loop — analyses 👎 answers, promotes admin corrections
  #    into the law DB so the same mistake won't happen again next week.
  - type: cron
    name: learning-loop
    env: python
    plan: free
    schedule: "0 3 * * 0"   # 3am Nairobi every Sunday (00:00 UTC Sunday)
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py learning_loop"

  - type: web
    name: hakimkononi
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate"
    startCommand: "gunicorn sheria_ai.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: META_WHATSAPP_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_VERIFY_TOKEN
        value: hakimkononi2026
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
